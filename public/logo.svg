<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- NodeByte Crawl logo: a spider/web-crawler node with data streams -->
  <defs>
    <linearGradient id="nbGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#nbGrad)"/>
  <!-- Spider/crawler body: central node -->
  <circle cx="32" cy="32" r="7" fill="white"/>
  <!-- 8 legs radiating outward (spider = web crawler) -->
  <g stroke="white" stroke-width="2.5" stroke-linecap="round">
    <!-- top -->
    <path d="M32 25 L32 14"/>
    <!-- top-right -->
    <path d="M37 27 L45 19"/>
    <!-- right -->
    <path d="M39 32 L50 32"/>
    <!-- bottom-right -->
    <path d="M37 37 L45 45"/>
    <!-- bottom -->
    <path d="M32 39 L32 50"/>
    <!-- bottom-left -->
    <path d="M27 37 L19 45"/>
    <!-- left -->
    <path d="M25 32 L14 32"/>
    <!-- top-left -->
    <path d="M27 27 L19 19"/>
  </g>
  <!-- Data nodes at the end of legs (small dots = crawled pages) -->
  <g fill="white">
    <circle cx="32" cy="13" r="2.5"/>
    <circle cx="46" cy="18" r="2"/>
    <circle cx="51" cy="32" r="2.5"/>
    <circle cx="46" cy="46" r="2"/>
    <circle cx="32" cy="51" r="2.5"/>
    <circle cx="18" cy="46" r="2"/>
    <circle cx="13" cy="32" r="2.5"/>
    <circle cx="18" cy="18" r="2"/>
  </g>
</svg>
